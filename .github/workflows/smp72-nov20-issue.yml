name: SMP72 Nov20 frozen-input issuance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'automation/smp72_latest/**'
      - '.github/workflows/smp72-nov20-issue.yml'

permissions:
  contents: read

concurrency:
  group: smp72-nov20-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/smp72_latest/requirements.txt
      - name: Install exact inference dependencies
        run: python -m pip install -r automation/smp72_latest/requirements.txt
      - name: Reproduce all 72 prices without issuing or collecting
        run: python automation/smp72_latest/issue.py --verify-only

  issue:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/smp72_latest/requirements.txt
      - name: Install fixed inference dependencies
        run: python -m pip install -r automation/smp72_latest/requirements.txt
      - name: Verify frozen artifacts and reproduce preliminary prices
        run: python automation/smp72_latest/issue.py --verify-only
      - name: Wait for the one dated 23:00 KST origin
        run: |
          python -u - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import time
          origin=datetime(2026,11,19,23,tzinfo=ZoneInfo('Asia/Seoul'))
          now=datetime.now(origin.tzinfo)
          if now>origin+timedelta(hours=15):
              raise SystemExit('Dated issuance window expired; refusing backdated publication')
          print('Waiting for',origin.isoformat(),'; current time',now.isoformat(),flush=True)
          while datetime.now(origin.tzinfo)<origin:
              time.sleep(min(30,max(0,(origin-datetime.now(origin.tzinfo)).total_seconds())))
          PY
      - name: Refresh main before changing generated forecast files
        run: git pull --ff-only origin main
      - name: Refilter and forecast using sealed pre-origin inputs
        run: |
          python automation/smp72_latest/issue.py
          python scripts/build_smp72_offline.py
          python -m unittest discover -s tests/smp72_demo -v
      - name: Save generated results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demo/forecast-20261120.json docs/demo/live-status.json docs/downloads/smp72-offline.html
          if ! git diff --cached --quiet; then
            git commit -m 'Issue Nov20 SMP forecast from frozen pre-origin inputs'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: issue
    runs-on: ubuntu-latest
    concurrency:
      group: smp-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the actually calculated forecast
        id: deployment
        uses: actions/deploy-pages@v4
